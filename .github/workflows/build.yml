name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Download cloudflared (arm64)
        working-directory: ServerRunner
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl --fail --location --silent --show-error \
            --output app/src/main/jniLibs/arm64-v8a/libcloudflared.so \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64

      - name: Check which Python libraries can be bundled
        working-directory: ServerRunner
        run: python .github/check_libs.py

      - name: Build debug APK
        working-directory: ServerRunner
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ServerRunner-apk
          path: |
            ServerRunner/app/build/outputs/apk/debug/*.apk
            ServerRunner/libs-report.txt
