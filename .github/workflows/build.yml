name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build pure-Python Pydantic wheel
        run: |
          python -m pip wheel --no-deps --no-binary=pydantic \
            --wheel-dir ServerRunner/app/wheels pydantic==1.10.24
          test -f ServerRunner/app/wheels/pydantic-1.10.24-py3-none-any.whl

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build cloudflared (arm64, with Android DNS fix)
        working-directory: ServerRunner
        run: |
          TAG=2026.1.1
          git clone --depth 1 --branch "$TAG" https://github.com/cloudflare/cloudflared.git cf
          python - <<'PY'
          from pathlib import Path

          path = Path("cf/ingress/origins/dns.go")
          source = path.read_text()
          old = "\t\taddresses: []netip.AddrPort{defaultResolverAddr},"
          new = (
              "\t\taddresses: []netip.AddrPort{netip.MustParseAddrPort(\"1.1.1.1:53\"), "
              "netip.MustParseAddrPort(\"8.8.8.8:53\")},\n\t\tstatic: true,"
          )
          if source.count(old) != 1:
              raise SystemExit("Could not apply Android DNS resolver patch")
          path.write_text(source.replace(old, new))
          PY
          cat > cf/cmd/cloudflared/zz_resolver.go <<'GOEOF'
          package main

          import (
              "context"
              "net"
              "os"
              "time"
          )

          func init() {
              // Android has no resolv.conf or system CA bundle in Go's usual paths.
              if os.Getenv("SSL_CERT_DIR") == "" && os.Getenv("SSL_CERT_FILE") == "" {
                  os.Setenv("SSL_CERT_DIR", "/apex/com.android.conscrypt/cacerts:/system/etc/security/cacerts")
              }
              net.DefaultResolver = &net.Resolver{
                  PreferGo: true,
                  Dial: func(ctx context.Context, network, address string) (net.Conn, error) {
                      d := net.Dialer{Timeout: 4 * time.Second}
                      c, err := d.DialContext(ctx, network, "1.1.1.1:53")
                      if err != nil {
                          return d.DialContext(ctx, network, "8.8.8.8:53")
                      }
                      return c, nil
                  },
              }
          }
          GOEOF
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd cf
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" \
            -o ../app/src/main/jniLibs/arm64-v8a/libcloudflared.so ./cmd/cloudflared

      - name: Check which Python libraries can be bundled
        working-directory: ServerRunner
        run: python .github/check_libs.py

      - name: Build debug APK
        working-directory: ServerRunner
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ServerRunner-apk
          path: |
            ServerRunner/app/build/outputs/apk/debug/*.apk
            ServerRunner/libs-report.txt
